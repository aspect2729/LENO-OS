# Production stack on EC2: one-shot migrate against Supabase, then the app.
# DATABASE_URL must point at your Supabase project (see .env.example).
services:
  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "drizzle-kit", "migrate"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}

  app:
    build:
      context: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "80:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
